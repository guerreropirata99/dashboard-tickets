<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard | Unidad de Arquitectura</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f0f4f8; }
        .kpi-grid { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 30px; }
        .kpi-card { background: white; padding: 20px; border-radius: 16px; min-width: 150px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .kpi-value { font-size: 2rem; font-weight: bold; color: #1a5d7a; }
        .kpi-label { font-size: 0.8rem; color: #666; text-transform: uppercase; }
        .card { background: white; padding: 20px; border-radius: 16px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid #ddd; }
        .badge { background: #ffe6b3; color: #b45f06; padding: 4px 8px; border-radius: 20px; font-size: 0.7rem; }
        .loading { text-align: center; padding: 50px; color: #1a5d7a; }
        canvas { max-height: 300px; }
    </style>
</head>
<body>

<div class="loading" id="loading">
    <h2>🔄 Cargando datos...</h2>
    <p>Leyendo archivo tickets.csv</p>
</div>

<div id="dashboard" style="display: none;">
    <h1>📐 UNIDAD DE ARQUITECTURA Y PROYECTOS</h1>
    <p>Análisis de tickets · <span id="fecha"></span></p>

    <div class="kpi-grid" id="kpiContainer"></div>

    <div class="card">
        <h3>📈 Evolución mensual</h3>
        <canvas id="lineChart"></canvas>
    </div>

    <div class="card">
        <h3>📅 Resumen por Año</h3>
        <table id="anioTable"><thead><tr><th>Año</th><th>Cerrados</th><th>Abiertos</th><th>Total</th></tr></thead><tbody></tbody></table>
    </div>

    <div class="card">
        <h3>⚠️ Tickets abiertos</h3>
        <table id="abiertosTable"><thead><tr><th>Ticket</th><th>Fecha</th><th>Propietario</th><th>Asunto</th></tr></thead><tbody></tbody></table>
    </div>

    <div class="card">
        <h3>📊 Por categoría</h3>
        <table id="catTable"><thead><tr><th>Categoría</th><th>Tickets</th><th>%</th></tr></thead><tbody></tbody></table>
    </div>
</div>

<script>
    const URL_CSV = 'datos/tickets.csv';
    let tickets = [];

    async function cargar() {
        try {
            const res = await fetch(URL_CSV);
            if (!res.ok) throw new Error('No se pudo cargar el CSV');
            const texto = await res.text();
            tickets = parseCSV(texto);
            document.getElementById('fecha').innerText = 'Actualizado: ' + new Date().toLocaleString();
            document.getElementById('loading').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            actualizar();
        } catch(e) {
            document.getElementById('loading').innerHTML = '<h2>❌ Error</h2><p>No se pudo cargar datos/tickets.csv</p>';
        }
    }

    function parseCSV(csv) {
        const lineas = csv.trim().split('\n');
        if (lineas.length < 2) return [];
        const headers = lineas[0].split(',').map(h => h.trim().replace(/"/g, ''));
        const datos = [];
        for (let i = 1; i < lineas.length; i++) {
            let enComillas = false;
            let valor = '';
            const fila = [];
            for (let c of lineas[i]) {
                if (c === '"') enComillas = !enComillas;
                else if (c === ',' && !enComillas) { fila.push(valor.trim()); valor = ''; }
                else valor += c;
            }
            fila.push(valor.trim());
            let obj = {};
            for (let j = 0; j < headers.length; j++) obj[headers[j]] = fila[j] || '';
            datos.push(obj);
        }
        return datos;
    }

    function actualizar() {
        const total = tickets.length;
        const cerrados = tickets.filter(t => t.Estado && t.Estado.toLowerCase() !== 'abierto').length;
        const abiertos = tickets.filter(t => t.Estado && t.Estado.toLowerCase() === 'abierto').length;
        
        document.getElementById('kpiContainer').innerHTML = `
            <div class="kpi-card"><div class="kpi-value">${total}</div><div class="kpi-label">Total tickets</div></div>
            <div class="kpi-card"><div class="kpi-value">${cerrados}</div><div class="kpi-label">Cerrados (${((cerrados/total)*100).toFixed(1)}%)</div></div>
            <div class="kpi-card"><div class="kpi-value">${abiertos}</div><div class="kpi-label">Abiertos</div></div>
        `;
        
        const meses = {};
        tickets.forEach(t => {
            if (!t.Creado) return;
            let fecha;
            if (t.Creado.includes('/')) {
                let p = t.Creado.split('/');
                fecha = new Date(p[2], p[1]-1, p[0]);
            } else fecha = new Date(t.Creado);
            if (isNaN(fecha)) return;
            let key = fecha.getFullYear() + '-' + String(fecha.getMonth()+1).padStart(2,'0');
            if (!meses[key]) meses[key] = { total: 0, cerrados: 0 };
            meses[key].total++;
            if (t.Estado && t.Estado.toLowerCase() !== 'abierto') meses[key].cerrados++;
        });
        
        let labels = Object.keys(meses).sort();
        let totals = labels.map(k => meses[k].total);
        let closed = labels.map(k => meses[k].cerrados);
        
        if (window.lineChart) window.lineChart.destroy();
        window.lineChart = new Chart(document.getElementById('lineChart'), {
            type: 'line',
            data: { labels, datasets: [
                { label: 'Creados', data: totals, borderColor: '#2c8f6e', fill: true },
                { label: 'Cerrados', data: closed, borderColor: '#e67e22', fill: true }
            ]}
        });
        
        let anios = { 2024: {t:0, c:0}, 2025: {t:0, c:0}, 2026: {t:0, c:0} };
        tickets.forEach(t => {
            if (!t.Creado) return;
            let año;
            if (t.Creado.includes('/')) año = parseInt(t.Creado.split('/')[2]);
            else año = new Date(t.Creado).getFullYear();
            if (anios[año]) { anios[año].t++; if (t.Estado && t.Estado.toLowerCase() !== 'abierto') anios[año].c++; }
        });
        
        let anioHtml = '';
        for (let a=2024; a<=2026; a++) {
            anioHtml += `<tr><td>${a}</td><td>${anios[a].c}</td><td>${anios[a].t - anios[a].c}</td><td>${anios[a].t}</td></tr>`;
        }
        document.querySelector('#anioTable tbody').innerHTML = anioHtml;
        
        let abiertosHtml = '';
        tickets.filter(t => t.Estado === 'abierto').slice(0,20).forEach(t => {
            abiertosHtml += `<tr><td>${t['Número de Ticket'] || ''}</td><td>${t.Creado || ''}</td><td>${t.Propietario || ''}</td><td>${(t.Asunto || '').substring(0,50)}</td></tr>`;
        });
        document.querySelector('#abiertosTable tbody').innerHTML = abiertosHtml;
        
        let cats = {};
        tickets.forEach(t => {
            let a = (t.Asunto || '').toUpperCase();
            let cat = 'Otros';
            if (a.includes('GPR')) cat = 'Gestión GPR';
            else if (a.includes('INFORME') || a.includes('PERFIL')) cat = 'Informes';
            else if (a.includes('CTI') || a.includes('MINTEL')) cat = 'CTI/Mintel';
            else if (a.includes('ALFRESCO')) cat = 'Carga documental';
            else if (a.includes('ARQUITECTURA')) cat = 'Arquitectura';
            else if (a.includes('CIBER') || a.includes('KERNEL')) cat = 'Ciberseguridad';
            cats[cat] = (cats[cat] || 0) + 1;
        });
        let catHtml = '';
        for (let [k,v] of Object.entries(cats).sort((a,b)=>b[1]-a[1])) {
            catHtml += `<tr><td>${k}</td><td>${v}</td><td>${((v/tickets.length)*100).toFixed(1)}%</td></tr>`;
        }
        document.querySelector('#catTable tbody').innerHTML = catHtml;
    }

    cargar();
</script>
</body>
</html>
